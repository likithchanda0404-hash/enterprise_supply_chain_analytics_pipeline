<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Supply Chain Operations KPI Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #111; }
    .header { padding: 24px 36px; background: #ffffff; border-bottom: 1px solid #ddd; }
    .header h1 { margin: 0; font-size: 28px; }
    .header p { margin: 8px 0 0; color: #555; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 36px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .metric { font-size: 26px; font-weight: bold; margin-top: 8px; }
    .charts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 36px 36px; }
    img { width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Supply Chain Operations KPI Dashboard</h1>
    <p>ETL-powered analytics for operations, finance, supplier contract validation, and inventory risk.</p>
  </div>
  <div class="grid">
    <div class="card"><div>Total Orders</div><div class="metric">600</div></div>
    <div class="card"><div>Total Revenue</div><div class="metric">$2,103,008</div></div>
    <div class="card"><div>Total Profit</div><div class="metric">$662,182</div></div>
    <div class="card"><div>On-Time Delivery Rate</div><div class="metric">75.5%</div></div>
  </div>
  <div class="charts">
    <img src="../outputs/profit_by_region.png" alt="Profit by Region">
    <img src="../outputs/delivery_status_distribution.png" alt="Delivery Status">
    <img src="../outputs/inventory_risk_summary.png" alt="Inventory Risk">
  </div>
</body>
</html>
